name: DNGWORLD News & TV — Hourly Refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-news.yml'
      - 'scripts/update_news.py'
      - 'scripts/check_news_freshness.py'
  workflow_dispatch:
  # Four recovery opportunities/hour to mitigate delayed/skipped GitHub schedules.
  # The freshness gate collects at most about once an hour.
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: dngworld-news-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest main instead of stale scheduled ref
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: due
        name: Decide whether new RSS/API collection is due
        env:
          GH_EVENT: ${{ github.event_name }}
        run: python scripts/check_news_freshness.py --gate >> "$GITHUB_OUTPUT"
      - name: Collect news and eligible videos
        if: steps.due.outputs.refresh == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DNG_TRANSLATE_MODEL: gpt-4o-mini
        run: |
          python scripts/update_news.py
          python scripts/check_news_freshness.py --validate
      - name: Commit verified new snapshot
        id: snapshot
        if: steps.due.outputs.refresh == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/newsroom.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh verified News & TV snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push conflict; fetching current main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          echo "::error::Cannot publish verified newsroom snapshot after retries"
          exit 1
      - name: Request ONE site deploy from latest main
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-dngworld-pages.yml --ref main
          echo "Dispatched website deploy using updated newsroom snapshot."
      - name: Record up-to-date scheduled run
        if: steps.due.outputs.refresh != 'true'
        run: echo "Latest newsroom snapshot is fresh; no API calls/deploy needed."
